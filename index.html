<style>
  :root {
    --paper: #f1e8d4;
    --paper-2: #e7dcc1;
    --paper-3: #d8c9a6;
    --ink: #1f1814;
    --ink-2: #3a2f25;
    --muted: #786551;
    --seal: #8b3a2e;
    --gold: #b8923a;
    --shadow: 0 2px 0 rgba(31,24,20,0.04), 0 10px 30px rgba(31,24,20,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #1a1612;
    color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", serif;
    overscroll-behavior: none;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
  }
  body {
    display: flex; align-items: stretch; justify-content: center;
    background:
      radial-gradient(1200px 600px at 50% -200px, #2b231b 0%, #1a1612 60%);
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% 0%, #f7eed9 0%, var(--paper) 55%, var(--paper-2) 100%);
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    overflow: hidden;
    isolation: isolate;
  }
  /* Subtle paper grain */
  #stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(120,101,81,0.06) 0, transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(120,101,81,0.06) 0, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  #stage::after {
    content:"";
    position: absolute; inset:0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.12 0 0 0 0 0.09 0 0 0 0 0.06 0 0 0 0.12 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 240px 240px;
    opacity: 0.4;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    z-index: 2;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 480ms ease, transform 480ms cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .scene.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .scene-inner {
    margin: auto 0;
    width: 100%;
    display: flex; flex-direction: column;
    gap: 22px;
  }
  .eyebrow {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .title {
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    font-size: clamp(22px, 6.4vw, 30px);
    line-height: 1.45;
    color: var(--ink);
    letter-spacing: 0.01em;
    text-wrap: pretty;
  }
  .body {
    font-family: "Noto Serif SC", serif;
    font-weight: 400;
    font-size: clamp(15px, 4.2vw, 17px);
    line-height: 1.85;
    color: var(--ink-2);
    overflow-wrap: break-word;
  }
  .body p {
    margin: 0 0 1em;
    text-align: justify;
    text-justify: inter-ideograph;
  }
  .body p:last-child { margin-bottom: 0; }
  .mono {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .arrow {
    margin: 24px auto 0;
    width: 56px; height: 56px;
    border-radius: 999px;
    border: 1px solid rgba(31,24,20,0.18);
    background: rgba(255,255,255,0.4);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
    flex: 0 0 auto;
    backdrop-filter: blur(4px);
  }
  .arrow svg { width: 22px; height: 22px; }
  @keyframes pulse {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(6px); }
  }
  .choices {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 8px;
  }
  .choice {
    appearance: none;
    border: 1px solid rgba(31,24,20,0.22);
    background: rgba(255,255,255,0.45);
    color: var(--ink);
    font-family: "Noto Sans SC", sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 16px 18px;
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
  }
  .choice:hover { background: rgba(255,255,255,0.7); }
  .choice:active { transform: scale(0.98); }
  .choice.shake { animation: shake 0.5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(31,24,20,0.92);
    color: #f1e8d4;
    padding: 14px 22px;
    border-radius: 12px;
    font-family: "Noto Sans SC", sans-serif;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 260ms ease, transform 260ms ease;
    z-index: 50;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Placeholder image card */
  .ph {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, #d8c9a6 0 10px, #d2c19a 10px 20px);
    border: 1px solid rgba(31,24,20,0.18);
    box-shadow: 0 6px 18px rgba(31,24,20,0.12);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    text-align: center;
    color: var(--ink-2);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    line-height: 1.6;
  }
  .ph::after {
    content: "";
    position: absolute; inset: 8px;
    border: 1px dashed rgba(31,24,20,0.25);
    border-radius: 4px;
    pointer-events: none;
  }
  .ph-label {
    background: rgba(241,232,212,0.92);
    padding: 6px 10px;
    border-radius: 4px;
    max-width: 80%;
    z-index: 1;
  }

  /* Note icon (easter egg) */
  .note {
    position: absolute;
    bottom: 92px;
    right: 18px;
    width: 36px; height: 44px;
    background: linear-gradient(180deg, #f7e9b8 0%, #ecd98a 100%);
    border: 1px solid #b8923a;
    border-radius: 2px 2px 6px 6px;
    transform: rotate(-6deg);
    box-shadow: 2px 4px 10px rgba(0,0,0,0.18);
    cursor: pointer;
    z-index: 20;
    animation: noteFloat 3s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    color: #6b5421;
  }
  .note::before {
    content: "";
    position: absolute;
    top: -4px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 8px;
    background: rgba(184,146,58,0.7);
    border-radius: 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .note span { transform: rotate(2deg); }
  @keyframes noteFloat {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50% { transform: rotate(-4deg) translateY(-4px); }
  }
  .note.gone { display: none; }

  /* ENVELOPE */
  .env-wrap {
    width: min(86%, 320px);
    aspect-ratio: 1.55 / 1;
    position: relative;
    margin: 0 auto;
    perspective: 1200px;
    cursor: pointer;
    user-select: none;
  }
  .env {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
  }
  .env-body {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #efe1bd 0%, #e4d2a5 100%);
    border: 1px solid #b8923a;
    border-radius: 4px;
    box-shadow: 0 14px 30px rgba(31,24,20,0.2), inset 0 -20px 30px rgba(0,0,0,0.06);
    overflow: visible;
  }
  .env-body::before {
    content:"";
    position: absolute; inset: 0;
    background:
      linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.15) 50%) bottom right / 60% 60% no-repeat;
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0;
    height: 60%;
    background: linear-gradient(180deg, #e8d6a8 0%, #d8c084 100%);
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 900ms cubic-bezier(.5,-0.2,.2,1.2);
    z-index: 3;
    border-top: 1px solid #b8923a;
  }
  .env.open .env-flap { transform: rotateX(-180deg); z-index: 1;}
  .env-seal {
    position: absolute;
    left: 50%; top: 56%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    background: radial-gradient(circle at 35% 35%, #b14a3e, #8b3a2e 60%, #5e271f 100%);
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    color: rgba(241,232,212,0.85);
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 26px;
    z-index: 4;
    transition: opacity 300ms;
  }
  .env.open .env-seal { opacity: 0; }
  .env-letter {
    position: absolute;
    left: 6%; right: 6%; top: 12%;
    height: 72%;
    background: #faf3e1;
    border: 1px solid #c8b88e;
    border-radius: 2px;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: transform 1100ms cubic-bezier(.2,.7,.2,1) 200ms;
    transform: translateY(0);
  }
  .env.open .env-letter { transform: translateY(-58%); }
  .env-letter::before, .env-letter::after {
    content:"";
    position: absolute;
    left: 14%; right: 14%;
    height: 1px;
    background: rgba(31,24,20,0.15);
  }
  .env-letter::before { top: 30%; }
  .env-letter::after { top: 55%; }
  .env-tap-hint {
    text-align: center;
    margin-top: 18px;
    font-family: "Noto Sans SC", sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* LETTER FULL */
  .letter-paper {
    background: #faf3e1;
    border: 1px solid #c8b88e;
    border-radius: 4px;
    padding: 26px 22px;
    box-shadow: 0 18px 36px rgba(31,24,20,0.15);
    position: relative;
    font-family: "Noto Serif SC", serif;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.95;
  }
  .letter-paper::before {
    content: "OFFER · 录用通知";
    position: absolute;
    top: 10px; left: 22px;
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--muted);
  }
  .letter-paper h3 {
    margin: 22px 0 12px;
    font-weight: 500;
    font-size: 15px;
  }
  .letter-paper p { margin: 0 0 12px; }
  .letter-stamp {
    position: absolute;
    right: 16px; bottom: 14px;
    width: 64px; height: 64px;
    border: 2px solid var(--seal);
    border-radius: 999px;
    color: var(--seal);
    font-family: "Ma Shan Zheng", serif;
    font-size: 13px;
    line-height: 1.1;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    transform: rotate(-12deg);
    opacity: 0.85;
  }

  /* WeChat-style stylized (NOT WeChat — generic chat bubble) */
  .chat {
    background: #ece6d4;
    border: 1px solid rgba(31,24,20,0.12);
    border-radius: 14px;
    padding: 14px 14px 18px;
    font-family: "Noto Sans SC", sans-serif;
    box-shadow: 0 6px 18px rgba(31,24,20,0.08);
  }
  .chat-header {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(31,24,20,0.1);
  }
  .bubble-row { display: flex; margin-bottom: 8px; gap: 8px; align-items: flex-start; }
  .bubble-row.me { flex-direction: row-reverse; }
  .av {
    width: 30px; height: 30px; border-radius: 4px;
    background: var(--paper-3); flex: 0 0 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--ink); font-weight: 500;
  }
  .av.me { background: #8aa37a; color: #f1e8d4; }
  .bubble {
    background: #faf3e1;
    border: 1px solid rgba(31,24,20,0.08);
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 78%;
    color: var(--ink);
  }
  .bubble.me { background: #b6d49a; color: var(--ink); }
  .search-row {
    background: #faf3e1;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex; gap: 10px; align-items: center;
    font-family: "Noto Sans SC", sans-serif;
    font-size: 13px;
    color: var(--ink-2);
    border: 1px solid rgba(31,24,20,0.08);
  }
  .search-row .key {
    color: var(--seal);
    font-weight: 700;
  }
  .search-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .search-item {
    background: #faf3e1;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--ink-2);
    border: 1px solid rgba(31,24,20,0.06);
    line-height: 1.6;
  }
  .search-item b { color: var(--seal); font-weight: 600; }
  .search-meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* terminal */
  .term {
    background: #16110d;
    color: #d8c9a6;
    border-radius: 8px;
    padding: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    line-height: 1.7;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .term .prompt { color: #8aa37a; }
  .term .danger { color: #e07a5f; }
  .term .blink { animation: cursor 1s steps(2) infinite; }
  @keyframes cursor { 50% { opacity: 0; } }

  /* News card (generic, original UI) */
  .news {
    background: #faf3e1;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid rgba(31,24,20,0.12);
    box-shadow: 0 10px 24px rgba(31,24,20,0.15);
    position: relative;
  }
  .news-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
  }
  .news-tag {
    display: inline-block;
    background: var(--seal);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
  }
  .news h4 {
    margin: 0 0 10px;
    font-family: "Noto Sans SC", sans-serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
  }
  .news-body {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 13px;
    line-height: 1.8;
    color: var(--ink-2);
  }
  .news-quote {
    margin-top: 10px;
    padding-left: 12px;
    border-left: 2px solid var(--gold);
    font-style: italic;
    color: var(--muted);
    font-size: 12px;
  }

  /* Scratch */
  .scratch-wrap {
    position: relative;
    width: min(86%, 320px);
    aspect-ratio: 1.5/1;
    margin: 8px auto;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(31,24,20,0.2);
    background: #faf3e1;
    user-select: none;
    touch-action: none;
  }
  .scratch-prize {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 30% 30%, #fff6da 0, #f0deaa 60%, #d8b96a 100%);
    color: var(--seal);
    font-family: "Ma Shan Zheng", serif;
    text-align: center;
    padding: 18px;
  }
  .scratch-prize .big {
    font-size: 44px;
    line-height: 1.1;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 0 rgba(139,58,46,0.2);
  }
  .scratch-prize .lab {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 12px;
    margin-top: 6px;
    color: var(--ink-2);
    letter-spacing: 0.3em;
  }
  .scratch-canvas {
    position: absolute; inset: 0;
    cursor: grab;
    touch-action: none;
  }
  .scratch-hint {
    text-align: center;
    font-family: "Noto Sans SC", sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.2em;
  }

  /* Fireworks / celebration */
  #fw { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  .celebrate {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 14vh 24px 24px;
    text-align: center;
    z-index: 40;
    color: var(--ink);
    overflow-y: auto;
  }
  .celebrate h1 {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: clamp(34px, 10vw, 44px);
    margin: 0 0 4px;
    letter-spacing: 0.08em;
    color: var(--seal);
  }
  .celebrate .sub {
    font-family: "Noto Sans SC", sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5em;
    margin-bottom: 18px;
  }
  .celebrate .blessing {
    background: rgba(250,243,225,0.7);
    border: 1px solid rgba(184,146,58,0.4);
    border-radius: 8px;
    padding: 18px 18px;
    font-family: "Noto Serif SC", serif;
    font-size: 14px;
    line-height: 1.95;
    color: var(--ink-2);
    text-align: left;
    overflow-wrap: break-word;
    box-shadow: 0 10px 24px rgba(31,24,20,0.1);
  }
  .celebrate .blessing p {
    text-align: justify;
    text-justify: inter-ideograph;
  }
  .celebrate .sign {

<script type="text/babel" data-source="scratch.jsx">
// Scratch card component
function ScratchCard({ onScratchedEnough, amount, label }) {
  const wrapRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const [done, setDone] = React.useState(false);
  const drawing = React.useRef(false);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    // metallic foil
    const g = ctx.createLinearGradient(0, 0, rect.width, rect.height);
    g.addColorStop(0, "#8a8478");
    g.addColorStop(0.5, "#c5b896");
    g.addColorStop(1, "#6e6657");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = "rgba(31,24,20,0.55)";
    ctx.font = "600 14px 'Noto Sans SC', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("刮开此处", rect.width / 2, rect.height / 2 - 4);
    ctx.font = "10px 'JetBrains Mono', monospace";
    ctx.fillStyle = "rgba(31,24,20,0.45)";
    ctx.fillText("SCRATCH HERE", rect.width / 2, rect.height / 2 + 14);
    ctx.globalCompositeOperation = "destination-out";
  }, []);

  const erase = (clientX, clientY) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const ctx = canvas.getContext("2d");
    ctx.beginPath();
    ctx.arc(x, y, 28, 0, Math.PI * 2);
    ctx.fill();
  };

  const checkProgress = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    // Sample only the central region (60% × 60% in the middle).
    const cx = Math.floor(w * 0.2);
    const cy = Math.floor(h * 0.2);
    const cw = Math.floor(w * 0.6);
    const ch = Math.floor(h * 0.6);
    const sample = ctx.getImageData(cx, cy, cw, ch).data;
    let cleared = 0, total = 0;
    for (let i = 3; i < sample.length; i += 4 * 16) {
      total++;
      if (sample[i] < 30) cleared++;
    }
    if (cleared / total > 0.55 && !done) {
      setDone(true);
      // Wipe the entire foil so the prize is fully revealed.
      ctx.clearRect(0, 0, w, h);
      onScratchedEnough && onScratchedEnough();
    }
  };

  const start = (e) => {
    drawing.current = true;
    move(e);
  };
  const end = () => {
    if (drawing.current) checkProgress();
    drawing.current = false;
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    erase(t.clientX, t.clientY);
    // Probe progress live so the user doesn't need to lift the finger.
    if (!done) checkProgress();
  };

  return (
    <div>
      <div className="scratch-wrap" ref={wrapRef}>
        <div className="scratch-prize">
          <div className="big">{amount}</div>
          <div className="lab">{label}</div>
        </div>
        <canvas
          ref={canvasRef}
          className="scratch-canvas"
          onMouseDown={start}
          onMouseMove={move}
          onMouseUp={end}
          onMouseLeave={end}
          onTouchStart={start}
          onTouchMove={move}
          onTouchEnd={end}
        />
      </div>
      <div className="scratch-hint">用手指/鼠标刮开</div>
    </div>
  );
}

window.ScratchCard = ScratchCard;

</script>

<script type="text/babel" data-source="app.jsx">
// Main app, scene routing, celebration, fireworks, note easter egg
const S = window.Scenes;
const E = React.createElement;

// ---- Audio controller ----
const Audio = (() => {
  let main, finale, muted = false, started = false, current = null;
  const get = () => {
    main = main || document.getElementById("audio-main");
    finale = finale || document.getElementById("audio-finale");
    if (main) main.volume = 0.5;
    if (finale) finale.volume = 0.6;
    return { main, finale };
  };
  const fade = (el, to, ms = 600) => {
    if (!el) return;
    const from = el.volume;
    const start = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - start) / ms);
      el.volume = from + (to - from) * k;
      if (k < 1) requestAnimationFrame(step);
      else if (to === 0) el.pause();
    };
    requestAnimationFrame(step);
  };
  const playTrack = (which) => {
    const { main, finale } = get();
    if (!main || !finale) return;
    if (current === which) return;
    current = which;
    if (muted) return;
    if (which === "main") {
      fade(finale, 0, 400);
      main.volume = 0;
      main.play().then(() => fade(main, 0.5, 800)).catch(()=>{});
    } else if (which === "finale") {
      fade(main, 0, 600);
      finale.currentTime = 0;
      finale.volume = 0;
      finale.play().then(() => fade(finale, 0.6, 1200)).catch(()=>{});
    } else if (which === "none") {
      // Silence both tracks (page 18: 什么都不放)
      fade(main, 0, 600);
      fade(finale, 0, 600);
    }
  };
  const start = () => {
    if (started) return;
    started = true;
    playTrack(current || "main");
  };
  const setMuted = (m) => {
    muted = m;
    const { main, finale } = get();
    [main, finale].forEach(a => { if (a) a.muted = m; });
    if (!m && started && current) playTrack(current);
  };
  const isMuted = () => muted;
  return { start, playTrack, setMuted, isMuted };
})();

// Bootstrap audio on first interaction (autoplay policy)
function bootstrapAudio() {
  const kick = () => {
    Audio.start();
    window.removeEventListener("pointerdown", kick);
    window.removeEventListener("keydown", kick);
    window.removeEventListener("touchstart", kick);
  };
  window.addEventListener("pointerdown", kick, { once: true });
  window.addEventListener("keydown", kick, { once: true });
  window.addEventListener("touchstart", kick, { once: true });
}
bootstrapAudio();

// Mute toggle wiring
(function setupMuteBtn() {
  const wire = () => {
    const btn = document.getElementById("mute-btn");
    if (!btn) { requestAnimationFrame(wire); return; }
    const on = document.getElementById("mute-icon-on");
    const off = document.getElementById("mute-icon-off");
    btn.addEventListener("click", () => {
      const next = !Audio.isMuted();
      Audio.setMuted(next);
      on.style.display = next ? "none" : "";
      off.style.display = next ? "" : "none";
    });
  };
  wire();
})();

const SCENE_ORDER = [
  "title", "envelope", "letter", "realize",
  "choiceOffer", "revealJob", "searchHeinu",
  "hr", "choiceOnboard", "revealRmrf",
  "award", "awardPhoto",
  "act1", "act1Photo",
  "act2", "act2Photo",
  "birthday", "birthdayPhoto",
  "act3", "act3Photo",
  "pregnancy", "pregnancyBelly", "pregnancyChat", "pregnancyReaction",
  "finalIntro", "finalNews", "celebrate",
];

// Which scenes can show the easter-egg note (acts 2-7 narrative beats)
const NOTE_SCENES = new Set([
  "award", "awardPhoto",
  "act1", "act1Photo",
  "act2", "act2Photo",
  "birthday", "birthdayPhoto",
  "act3", "act3Photo",
  "pregnancy", "pregnancyBelly", "pregnancyChat", "pregnancyReaction",
]);

function App() {
  const [scene, setScene] = React.useState("title");
  const [sceneProps, setSceneProps] = React.useState({});
  const [returnTo, setReturnTo] = React.useState(null);
  const [lotteryUsed, setLotteryUsed] = React.useState(false);
  const [toastMsg, setToastMsg] = React.useState("");
  const toastRef = React.useRef(null);

  const showToast = (msg, dur = 1400) => {
    setToastMsg(msg);
    const t = toastRef.current;
    if (!t) return;
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove("show"), dur);
  };

  const go = (next, extraProps = {}) => {
    // Audio routing:
    //  - finalNews (page 18): silence — no track
    //  - celebrate: finale track
    //  - title / everything else: main track
    if (next === "finalNews") Audio.playTrack("none");
    else if (next === "celebrate") Audio.playTrack("finale");
    else if (next === "title") Audio.playTrack("main");
    setScene(next);
    setSceneProps(extraProps);
    // scroll active scene to top
    setTimeout(() => {
      const el = document.querySelector(".scene.active");
      if (el) el.scrollTop = 0;
    }, 50);
  };

  const onNoteClick = () => {
    if (lotteryUsed) return;
    setLotteryUsed(true);
    setReturnTo(scene);
    go("lotteryIntro");
  };

  // update note visibility / progress label
  React.useEffect(() => {
    const note = document.getElementById("note");
    if (note) {
      if (NOTE_SCENES.has(scene) && !lotteryUsed) {
        note.classList.remove("gone");
        note.onclick = onNoteClick;
      } else {
        note.classList.add("gone");
      }
    }
    const prog = document.getElementById("progress");
    if (prog) {
      const idx = SCENE_ORDER.indexOf(scene);
      if (idx >= 0) {
        prog.textContent = String(idx + 1).padStart(2, "0") + " · " + String(SCENE_ORDER.length).padStart(2, "0");
      } else {
        prog.textContent = "彩 · 蛋";
      }
    }
  }, [scene, lotteryUsed]);

  function getNextMain(s) {
    const i = SCENE_ORDER.indexOf(s);
    if (i === -1) return "act2";
    return SCENE_ORDER[Math.min(i + 1, SCENE_ORDER.length - 1)];
  }

  const restart = () => {
    setLotteryUsed(false);
    setReturnTo(null);
    Audio.playTrack("main");
    go("title");
  };

  const map = {
    title: S.TitleScene,
    envelope: S.EnvelopeScene,
    letter: S.LetterScene,
    realize: S.RealizeScene,
    choiceOffer: S.ChoiceOfferScene,
    revealJob: S.RevealJobScene,
    searchHeinu: S.SearchHeinuScene,
    hr: S.HRScene,
    choiceOnboard: S.ChoiceOnboardScene,
    revealRmrf: S.RevealRmrfScene,
    award: S.AwardScene,
    awardPhoto: S.AwardPhotoScene,
    act1: S.Act1Scene,
    act1Photo: S.Act1PhotoScene,
    act2: S.Act2Scene,
    act2Photo: S.Act2PhotoScene,
    birthday: S.BirthdayScene,
    birthdayPhoto: S.BirthdayPhotoScene,
    act3: S.Act3Scene,
    act3Photo: S.Act3PhotoScene,
    pregnancy: S.PregnancyScene,
    pregnancyBelly: S.PregnancyBellyScene,
    pregnancyChat: S.PregnancyChatScene,
    pregnancyReaction: S.PregnancyReactionScene,
    lotteryIntro: S.LotteryIntro,
    lotteryScratch: S.LotteryScratch,
    lotteryReveal2: S.LotteryReveal2,
    lotteryHandshake: S.LotteryHandshake,
    lotteryLost: (p) => E(S.LotteryLost, { ...p, returnTo }),
    finalIntro: S.FinalIntroScene,
    finalNews: S.FinalNewsScene,
  };

  // Celebration scene is special: full takeover
  if (scene === "celebrate") {
    Audio.playTrack("finale");
    return E(Celebration, { restart });
  }

  const Cur = map[scene];

  return (
    <div className="scene active" data-screen-label={"scene-" + scene}>
      {Cur && E(Cur, { go, ...sceneProps })}
    </div>
  );
}

// Sync toast text
function MountToast() {
  return null;
}

// ---- Celebration ----
function Celebration({ restart }) {
  React.useEffect(() => {
    const c = document.getElementById("fw");
    if (!c) return;
    const ctx = c.getContext("2d");
    const rect = c.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
    c.style.width = rect.width + "px";
    c.style.height = rect.height + "px";
    ctx.scale(dpr, dpr);

    let parts = [];
    let confetti = [];
    let raf;
    let lastFw = 0;

    const COLORS = ["#8b3a2e", "#b8923a", "#5d7b4a", "#c08a3a", "#d4925a", "#e6c068"];

    function launchFirework() {
      const x = rect.width * (0.2 + Math.random() * 0.6);
      const y = rect.height * (0.2 + Math.random() * 0.4);
      const color = COLORS[(Math.random() * COLORS.length) | 0];
      const n = 36 + ((Math.random() * 18) | 0);
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n + Math.random() * 0.1;
        const sp = 2 + Math.random() * 3;
        parts.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1,
          color,
        });
      }
    }
    function spawnConfetti() {
      for (let i = 0; i < 2; i++) {
        confetti.push({
          x: Math.random() * rect.width,
          y: -10,
          vy: 1 + Math.random() * 2,
          vx: (Math.random() - 0.5) * 1.2,
          r: 3 + Math.random() * 3,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.2,
        });
      }
    }

    function tick(t) {
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (t - lastFw > 700) {
        launchFirework();
        lastFw = t;
      }
      spawnConfetti();

      parts = parts.filter(p => p.life > 0);
      parts.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.vx *= 0.99;
        p.life -= 0.012;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      confetti = confetti.filter(c => c.y < rect.height + 20);
      confetti.forEach(co => {
        co.x += co.vx;
        co.y += co.vy;
        co.rot += co.vrot;
        ctx.save();
        ctx.translate(co.x, co.y);
        ctx.rotate(co.rot);
        ctx.fillStyle = co.color;
        ctx.fillRect(-co.r, -co.r * 0.4, co.r * 2, co.r * 0.8);
        ctx.restore();
      });

      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      // Clear canvas so leftover frames don't linger after restart
      ctx.clearRect(0, 0, rect.width, rect.height);
    };
  }, []);

  return (
    <div className="celebrate">
      <div className="sub">G O O D · L U C K</div>
      <h1>恭 喜 脱 离 苦 海</h1>
      <div className="sub" style={{ letterSpacing: "0.3em", marginTop: 4 }}>2023 — 2025 · 一段两年的回忆</div>

      <div className="blessing" style={{ marginTop: 28 }}>
        <p>你不知道这两年有什么意义。加了多少次班，导了多少张表，填了多少份安全检查材料。不会有人记得，就连你自己也会慢慢忘记。</p>
        <p>集群也不在乎，它只是继续在亚健康状态顽强地运行着。</p>
        <p>但没关系，你决定先回家。</p>
        <p>长春的夏天快到了。或许净月潭的树影、南湖的晚风，和傍晚终于慢下来的天光会告诉你答案，又或许不会。但至少那里没有台账要写。</p>
        <p>至于未来——谁知道呢。也许有一天你在K线图里抓住了一根改变命运的阳线，实现了所有打工人做梦都不敢做的财富自由。到那时候记得回来请大家吃饭，<span style={{ color: "var(--seal)" }}>别让魏姓同事知道你的新地址就行</span>。</p>
      </div>

      <div className="sign">祝前路松弛，钱包膨胀。</div>
      <button className="restart" onClick={restart}>再来一遍 ↻</button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
